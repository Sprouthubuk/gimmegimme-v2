name: CI
on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npx astro check
      - run: npm run build
      - run: npm test

  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      mysql:
        image: mysql:8.4
        env: { MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: gimme_test }
        ports: ["3306:3306"]
        options: --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: "8.3", extensions: "gmp, intl, bcmath, pdo_mysql, pdo_sqlite", coverage: none }
      - run: composer install --no-interaction --prefer-dist
        env:
          # A GitHub token that can read Sprouthubuk/verity-engine: {"github-oauth":{"github.com":"<token>"}}
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
      # Verity's integrity guards are triggers: MySQL must let this user create them.
      - run: mysql -h127.0.0.1 -uroot -proot -e "SET PERSIST log_bin_trust_function_creators = 1"
      - run: cp .env.example .env && php artisan key:generate
      - name: Tests on MySQL (as production)
        run: php artisan test
        env: { DB_CONNECTION: mysql, DB_HOST: 127.0.0.1, DB_DATABASE: gimme_test, DB_USERNAME: root, DB_PASSWORD: root }
      - name: Tests on SQLite
        run: php artisan test

  fullstack:
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: "8.3", extensions: "gmp, intl, bcmath, pdo_sqlite", coverage: none }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: composer install --no-interaction --prefer-dist && cp .env.example .env && php artisan key:generate
        working-directory: backend
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
      - run: npm ci && npm run build && npm run test:fullstack
        working-directory: frontend
      # Every page at 320/390/820/1440px: console errors, sideways scroll, broken pictures, words run together.
      - run: npm run test:visual
        working-directory: frontend
        env: { CHROME_PATH: /usr/bin/google-chrome, SHOTS_DIR: "${{ runner.temp }}/shots" }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: screenshots, path: "${{ runner.temp }}/shots", retention-days: 14 }
