# Forge → Server → Processes → Background process (name: gimme-web, user: forge)
#   Directory: /home/forge/<site>/current/frontend
#   Command (one line):
#   env HOST=127.0.0.1 PORT=4321 NODE_ENV=production PUBLIC_SITE_URL=https://<site address> API_INTERNAL_URL=http://127.0.0.1:8080 node /home/forge/<site>/current/frontend/dist/server/entry.mjs
#
# PUBLIC_SITE_URL must match FRONTEND_URL in the site's environment (and the address people use).
# API_INTERNAL_URL is nginx's private listener (see the second block in nginx.conf).
#
# Queue worker (name: gimme-queue): php8.5 /home/forge/<site>/current/backend/artisan queue:work database --sleep=3 --tries=3 --backoff=10
# Scheduler (every minute):          php8.5 /home/forge/<site>/current/backend/artisan schedule:run
