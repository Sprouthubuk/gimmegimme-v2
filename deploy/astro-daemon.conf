# Forge → Server → Daemons → New Daemon
#   Command:   node dist/server/entry.mjs
#   Directory: /home/forge/gimmegimmeprizes.co.uk/current/frontend
#   User:      forge      Processes: 1
# Forge writes the supervisor file; name it gimme-astro so the deploy script can restart it.
# The process reads these from the environment — set them in the daemon's command
# instead if you prefer, e.g. `env $(cat ../shared/frontend.env | xargs) node dist/server/entry.mjs`:
HOST=127.0.0.1
PORT=4321
PUBLIC_SITE_URL=https://gimmegimmeprizes.co.uk
# Astro calls Laravel through nginx on the same box (127.0.0.1 would hit the default site).
API_INTERNAL_URL=https://gimmegimmeprizes.co.uk
NODE_ENV=production
