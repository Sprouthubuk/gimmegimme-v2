# Forge → Site → Files → Edit Nginx Configuration. Replace the `location /` block
# Forge generated with the blocks below; keep Forge's SSL, server_name and
# `root /home/forge/<site>/current/backend/public;` lines as they are.
#
# Laravel answers /api, /sanctum, /admin (Filament), /livewire, /webhooks, /media
# and Filament's assets. Everything else is the Astro Node server on 127.0.0.1:4321.

    client_max_body_size 12m;

    # Laravel (PHP-FPM)
    location ~ ^/(api|sanctum|admin|livewire|webhooks|filament|storage|media)(/|$) {
        try_files $uri $uri/ /index.php?$query_string;
    }
    location ~ ^/(css|js)/filament/ {
        try_files $uri =404;
        expires 30d;
    }
    location = /index.php {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;
    }
    location ~ \.php$ { return 404; }

    # Astro's built assets: fingerprinted, cache for a year.
    location /_astro/ {
        alias /home/forge/gimmegimmeprizes.co.uk/current/frontend/dist/client/_astro/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Everything else: Astro.
    location / {
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
    }
