# New Forge: Site → ⋯ → Edit Nginx configuration edits what goes INSIDE the site's `server { }`
# (Forge keeps listen, server_name, root and the certificate itself). Keep Forge's ssl_*, add_header,
# charset and `include forge-conf/<site id>/server/*;` lines, and replace its `location /`,
# `error_page` and `location ~ \.php$` blocks with the ones below.
# The applied staging copy (gimmegimme.on-forge.com, behind Cloudflare) is deploy/nginx-staging-site.conf.
#
# Laravel answers /api (including /api/webhooks/cashflows), /sanctum, /admin (Filament), /livewire,
# /verity (Verity's public verification JSON), /storage (uploaded pictures) and Filament's assets. Everything else is the Astro Node server on 127.0.0.1:4321.

    client_max_body_size 12m;

    # Laravel (PHP-FPM)
    location ~ ^/(api|sanctum|admin|livewire|verity|storage)(/|$) {
        try_files $uri $uri/ /index.php?$query_string;
    }
    location ~ ^/(css|js|fonts)/filament/ {
        try_files $uri =404;
        expires 30d;
    }
    location /vendor/verity/ {
        try_files $uri =404;
    }
    location = /index.php {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/var/run/php/php8.5-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;
    }
    location ~ \.php$ { return 404; }

    # Astro's built assets: fingerprinted, cache for a year.
    location /_astro/ {
        alias /home/forge/<site>/current/frontend/dist/client/_astro/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Everything else: Astro.
    location / {
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
    }

# ---------------------------------------------------------------------------------------------
# A second server block, OUTSIDE the main `server { }`. Forge's editor can't add one, so it goes in
# /etc/nginx/forge-conf/<site id>/after/ (root-owned; included after the main block):
#   sudo cp ~/gimme-internal.conf /etc/nginx/forge-conf/<site id>/after/gimme-internal.conf
#   sudo nginx -t && sudo service nginx reload
# Astro calls Laravel here (API_INTERNAL_URL=http://127.0.0.1:8080). It listens on the loopback
# address only, so nothing outside the server can reach it, and Laravel trusts 127.0.0.1 as a
# proxy: the visitor's real address (X-Forwarded-For, set by the main block and passed on by
# Astro) is what rate limits and logs see — not the server's own address for every page view.
