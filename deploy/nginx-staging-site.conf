# Staging: Forge site 3497591 (gimmegimme.on-forge.com). Pasted into Edit Nginx configuration on 13 Nov 2026.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
ssl_prefer_server_ciphers off;
ssl_dhparam /etc/nginx/dhparams.pem;

add_header X-Frame-Options "SAMEORIGIN";
add_header X-XSS-Protection "1; mode=block";
add_header X-Content-Type-Options "nosniff";

index index.php;

charset utf-8;

# FORGE CONFIG (DO NOT REMOVE!)
include forge-conf/3497591/server/*;

client_max_body_size 12m;

# The on-forge.com address sits behind Cloudflare: take the visitor's real address from it.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# Laravel (PHP-FPM): API, Sanctum, Filament admin, Livewire, Verity, uploads.
location ~ ^/(api|sanctum|admin|livewire|verity|storage)(/|$) {
    try_files $uri $uri/ /index.php?$query_string;
}
location ~ ^/(css|js|fonts)/filament/ {
    try_files $uri =404;
    expires 30d;
}
location /vendor/verity/ {
    try_files $uri =404;
}
location = /index.php {
    fastcgi_split_path_info ^(.+\.php)(/.+)$;
    fastcgi_pass unix:/var/run/php/php8.5-fpm.sock;
    fastcgi_index index.php;
    include fastcgi_params;
    include forge_fastcgi_defaults;
}
location ~ \.php$ { return 404; }

# Astro's built assets: fingerprinted, cached for a year.
location /_astro/ {
    alias /home/forge/gimmegimme.on-forge.com/current/frontend/dist/client/_astro/;
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
}

# Everything else: the Astro server.
location / {
    proxy_pass http://127.0.0.1:4321;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
    proxy_read_timeout 30s;
    # Room for Laravel's session cookies passed back on a page (default 4k is too tight).
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;
}

location = /favicon.ico { access_log off; log_not_found off; proxy_pass http://127.0.0.1:4321; }
location = /robots.txt  { access_log off; log_not_found off; proxy_pass http://127.0.0.1:4321; }

access_log off;
error_log  /var/log/nginx/3497591-error.log error;

location ~ /\.(?!well-known).* {
    deny all;
}
