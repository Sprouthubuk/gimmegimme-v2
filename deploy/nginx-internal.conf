# Private listener: Astro calls Laravel here (API_INTERNAL_URL=http://127.0.0.1:8080).
server {
    listen 127.0.0.1:8080;
    server_name _;
    server_tokens off;
    root /home/forge/gimmegimme.on-forge.com/current/backend/public;
    index index.php;
    client_max_body_size 12m;
    access_log off;
    error_log /var/log/nginx/3497591-internal-error.log error;
    location / { try_files $uri /index.php?$query_string; }
    location = /index.php {
        fastcgi_pass unix:/var/run/php/php8.5-fpm.sock;
        include fastcgi_params;
        include forge_fastcgi_defaults;
    }
    location ~ \.php$ { return 404; }
}
